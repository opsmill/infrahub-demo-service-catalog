---
x-infrahub-custom-build: &infrahub_custom_build
  image: opsmill/infrahub-demo-service-catalog:${INFRAHUB_BASE_VERSION:-1.11.0}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      INFRAHUB_BASE_VERSION: "${INFRAHUB_BASE_VERSION:-1.11.0}"
  environment:
    INFRAHUB_GIT_IMPORT_SYNC_BRANCH_NAMES: '["^demo/.*$"]'
services:
  service-catalog:
    <<: *infrahub_custom_build
    environment:
      INFRAHUB_ADDRESS: http://infrahub-server:8000
      INFRAHUB_API_TOKEN: ${INFRAHUB_API_TOKEN:-44af444d-3b26-410d-9546-b758657e026c}
    ports:
      - 8501:8501
    command: uv run streamlit run /opt/local/service_catalog/🏠_Home_Page.py
  infrahub-server:
    <<: *infrahub_custom_build
  task-worker:
    <<: *infrahub_custom_build
    volumes:
      - ./:/upstream
  task-manager:
    <<: *infrahub_custom_build
    ports:
      - 4200:4200
  semaphore:
    build:
      context: ./semaphore
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: semaphore
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      SEMAPHORE_FORWARDED_ENV_VARS: '["INFRAHUB_ADDRESS","INFRAHUB_API_TOKEN"]'
      INFRAHUB_ADDRESS: http://infrahub-server:8000
      INFRAHUB_API_TOKEN: ${INFRAHUB_API_TOKEN:-44af444d-3b26-410d-9546-b758657e026c}
    ports:
      - "3000:3000"
    volumes:
      - ./ansible:/opt/semaphore/playbooks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
  backstage:
    image: opsmill/infrahub-demo-backstage:local
    build:
      context: ./backstage
      dockerfile: packages/backend/Dockerfile
    # The bundle is built on the host, so run `invoke backstage-build` before
    # this image is built or rebuilt.
    command:
      - node
      - packages/backend
      - --config
      - app-config.yaml
      - --config
      - app-config.docker.yaml
    restart: unless-stopped
    depends_on:
      infrahub-server:
        condition: service_healthy
    environment:
      INFRAHUB_ADDRESS: http://infrahub-server:8000
      INFRAHUB_API_TOKEN: ${INFRAHUB_API_TOKEN:-44af444d-3b26-410d-9546-b758657e026c}
    ports:
      # The backend serves the frontend bundle, so one port does both.
      - "3001:7007"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:7007/.backstage/health/v1/readiness').then(r
          => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
