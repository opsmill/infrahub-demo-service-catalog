---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

# Copied from the OpsMill schema library (github.com/opsmill/schema-library), file
# `extensions/location_minimal/location_minimal.yml`.
# Library version: not known. The repository does not record the library commit or release. First
# committed here on 2024-12-24 (6bce96e).
# Taken: the file as a whole. The repository does not record whether parts were left out when it
# was copied.
# Re-check on upgrade: this copy is no longer refreshed from the library. Reconcile library
# changes by hand and keep the local edits below.
# Local edits, from the git history of this file (date, commit, change and reason):
# - 2026-03-16 3450912: `display_labels` lists replaced by `display_label`, because the list form
#   is deprecated.
# - 2026-05-29 27124a3: display label `name (shortname)` on LocationCountry, LocationMetro,
#   LocationSite and LocationRack, `parent: null` on LocationCountry and `children: null` on
#   LocationRack, from a schema audit.
# - 2026-10-10 482d8d6: added `order_weight` values, from a schema audit.
# - 2026-10-13 90f399a: `include_in_menu: false` on the four nodes, because `menu.yml` gives each
#   node one sidebar entry.
# - 2026-10-13 3d476e9: identifiers on the site and rack `owner`, and the extension moved from
#   OrganizationProvider to OrganizationGeneric with `sites` and `racks`, so each owner
#   relationship has its reverse on every organization.

nodes:
  - name: Country
    namespace: Location
    label: Country
    inherit_from:
      - LocationGeneric
    include_in_menu: false
    menu_placement: LocationGeneric
    display_label: "{{ name__value }} ({{ shortname__value }})"
    parent: null
    children: LocationMetro
    icon: gis:search-country
    attributes:
      - name: timezone
        kind: Text
        optional: true
        order_weight: 1300

  - name: Metro
    namespace: Location
    label: Metro
    inherit_from:
      - LocationGeneric
    include_in_menu: false
    menu_placement: LocationGeneric
    display_label: "{{ name__value }} ({{ shortname__value }})"
    parent: LocationCountry
    children: LocationSite
    icon: healthicons:city

  - name: Site
    namespace: Location
    label: Site
    inherit_from:
      - LocationGeneric
      - LocationHosting
    include_in_menu: false
    menu_placement: LocationGeneric
    display_label: "{{ name__value }} ({{ shortname__value }})"
    parent: LocationMetro
    children: LocationRack
    icon: ri:building-line
    attributes:
      - name: facility_id
        kind: Text
        unique: false
        optional: true
        order_weight: 1100
      - name: physical_address
        kind: Text
        unique: false
        optional: true
        order_weight: 1500
    relationships:
      - name: owner
        peer: OrganizationGeneric
        optional: true
        cardinality: one
        order_weight: 3500
        identifier: locationsite__organizationgeneric

  - name: Rack
    namespace: Location
    label: Rack
    inherit_from:
      - LocationGeneric
      - LocationHosting
    include_in_menu: false
    display_label: "{{ name__value }} ({{ shortname__value }})"
    menu_placement: LocationGeneric
    parent: LocationSite
    children: null
    icon: clarity:rack-server-line
    attributes:
      - name: facility_id
        kind: Text
        unique: false
        optional: true
        order_weight: 1100
      - name: height
        label: Height (U)
        optional: false
        default_value: 42
        kind: Number
        order_weight: 1300
    relationships:
      - name: owner
        peer: OrganizationGeneric
        optional: true
        cardinality: one
        order_weight: 3500
        identifier: locationrack__organizationgeneric

extensions:
  nodes:
    # The reverse of the site and rack `owner`, on every organization: a provider, a manufacturer or a customer.
    - kind: OrganizationGeneric
      relationships:
        - name: sites
          peer: LocationSite
          cardinality: many
          optional: true
          order_weight: 3300
          identifier: locationsite__organizationgeneric
        - name: racks
          peer: LocationRack
          cardinality: many
          optional: true
          order_weight: 3400
          identifier: locationrack__organizationgeneric
