---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

nodes:
  - name: Tier
    namespace: Service
    description: "The promise made to a customer: the separate paths each active service keeps during a change"
    label: Service Tier
    icon: mdi:medal-outline
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    attributes:
      - name: name
        kind: Text
        unique: true
        order_weight: 1000
      - name: min_paths
        kind: Number
        label: Minimum separate paths during a change
        description: Separate paths each active service of this tier must keep during a change. Empty or 0 is not checked.
        optional: true
        order_weight: 1300
    relationships:
      - name: services
        peer: ServiceGeneric
        kind: Generic
        cardinality: many
        optional: true
        identifier: service__tier
        branch: aware
        order_weight: 3000
