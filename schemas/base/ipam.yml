---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

# Copied from the OpsMill schema library (github.com/opsmill/schema-library), file
# `base/ipam.yml`.
# Library version: not known. The repository does not record the library commit or release. First
# committed here on 2024-12-24 (6bce96e).
# Taken: the file as a whole. The repository does not record whether parts were left out when it
# was copied.
# Re-check on upgrade: this copy is no longer refreshed from the library. Reconcile library
# changes by hand and keep the local edits below.
# Local edits, from the git history of this file (date, commit, change and reason):
# - 2026-03-16 16ebc02: identifier `location__prefixes` on the prefix `location`, to pair it with
#   LocationHosting `prefixes`.
# - 2026-03-16 3450912: `display_labels` lists replaced by `display_label`, because the list form
#   is deprecated.
# - 2026-10-10 482d8d6: added `order_weight` values, from a schema audit.
# - 2026-10-13 3d476e9: reverse relationships IpamIPAddress `primary_address_of` and `gateway_of`,
#   the identifier `ipamprefix__organizationgeneric` on the prefix `organization`, and a
#   description on `gateway`, so each cardinality-one relationship has its reverse.

nodes:
  # --------------------  IPAM (Prefix, IP Address)  --------------------
  - name: IPAddress
    namespace: Ipam
    description: IP Address
    label: IP Address
    icon: mdi:ip
    include_in_menu: false
    order_by:
      - address__value
    display_label: address__value
    inherit_from:
      - BuiltinIPAddress
    uniqueness_constraints:
      - [ip_namespace, address__value]
    human_friendly_id:
      - address__value
      - ip_namespace__name__value
    attributes:
      - name: fqdn
        label: FQDN
        kind: Text
        optional: true
        order_weight: 2100
        # https://stackoverflow.com/questions/11809631/fully-qualified-domain-name-validation
        regex: (?=^.{1,253}$)(^(((?!-)[a-zA-Z0-9-]{1,63}(?<!-))|((?!-)[a-zA-Z0-9-]{1,63}(?<!-)\.)+[a-zA-Z]{2,63})$)
    relationships:
      - name: interface
        peer: DcimInterfaceL3
        optional: true
        cardinality: one
        order_weight: 3500
      - name: primary_address_of
        label: Primary Address Of
        description: The devices that use this IP address as their primary address.
        peer: DcimGenericDevice
        optional: true
        cardinality: many
        order_weight: 3600
        identifier: dcimgenericdevice__ipamipaddress
      - name: gateway_of
        label: Gateway Of
        description: The prefixes whose layer 3 gateway is this IP address.
        peer: IpamPrefix
        optional: true
        cardinality: many
        order_weight: 3700
        identifier: prefix__gateway

  - name: Prefix
    namespace: Ipam
    description: IPv4 or IPv6 network (with mask)
    icon: mdi:ip-network
    include_in_menu: false
    label: Prefix
    order_by:
      - prefix__value
    display_label: prefix__value
    inherit_from:
      - BuiltinIPPrefix
    uniqueness_constraints:
      - [ip_namespace, prefix__value]
    human_friendly_id:
      - prefix__value
      - ip_namespace__name__value
    attributes:
      - name: status
        kind: Dropdown
        order_weight: 1100
        choices:
          - name: active
            label: Active
          - name: deprecated
            label: Deprecated
          - name: reserved
            label: Reserved
      - name: role
        kind: Dropdown
        optional: true
        order_weight: 2100
        choices:
          - name: loopback
            label: Loopback
            description: Represents internal communications.
            color: "#B0A8B9"
          - name: management
            label: Management
            description: Handles administrative operations.
            color: "#AEC6CF"
          - name: public
            label: Public
            description: Public facing network.
            color: "#FDFD96"
          - name: server
            label: Server
            description: Dedicated to server functions.
            color: "#77DD77"
          - name: supernet
            label: Supernet
            description: Covers multiple networks
            color: "#FFB347"
          - name: technical
            label: Technical
            description: Focused on technical aspects.
            color: "#9678B6"
          - name: loopback-vtep
            label: Loopback VTEP
            description: Facilitates virtualized network communications within loopback configurations.
            color: "#CDB4DB"
          - name: customer
            label: Customer
            description: Dedicated to connect a customer.
            color: "#1B5583"
    relationships:
      - name: organization
        peer: OrganizationGeneric
        optional: true
        cardinality: one
        kind: Attribute
        order_weight: 1200
        identifier: ipamprefix__organizationgeneric
      - name: location
        peer: LocationHosting
        optional: true
        cardinality: one
        kind: Attribute
        order_weight: 1300
        identifier: location__prefixes
      - name: gateway
        label: L3 Gateway
        description: The prefix's gateway IP address. For a service prefix, the service's gateway IP address is authoritative.
        identifier: prefix__gateway
        peer: IpamIPAddress
        optional: true
        cardinality: one
        kind: Attribute
        order_weight: 1500
