---
# Shared values of the router interfaces of the Generic router template (data/07_device_template.yml).
# A profile value applies only where the interface does not set the attribute itself, so the template
# interfaces leave role, MTU and enabled to these profiles. Speed stays on each interface.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ProfileDcimInterfaceL3
  data:
    - profile_name: "Transit Interface"
      profile_priority: 1000
      role: upstream
      mtu: 1500
      enabled: true
    - profile_name: "Peer to Peer Interface"
      profile_priority: 1000
      role: backbone
      mtu: 9000
      enabled: true
