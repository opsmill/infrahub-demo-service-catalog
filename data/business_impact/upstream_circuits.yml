---
# The upstream circuits of the cost of service. `invoke seed` loads this file
# after it loads the circuit schema (schemas/circuit). It is not listed in
# .infrahub.yml, so the repository import works without the circuit schema.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCircuit
  data:
    # One upstream circuit per edge router. Endpoint A lands on the router's
    # Ethernet4. The inline interface block sets that Ethernet4 to active,
    # because it carries the circuit.
    # ------------------------------------------------------------
    # Paris
    # ------------------------------------------------------------
    - circuit_id: "COG-PAR-TR-1001"
      circuit_type: upstream
      status: active
      description: "Cogent upstream transit for Paris edge router 1"
      provider: "Cogent Communications"
      location: "par01"
      monthly_cost: 2500  # demo input
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - name: "A"
            status: active
            location: "par01"
            connected_endpoint:
              kind: DcimInterfaceL3
              data:
                device: "rb01-par01"
                name: "Ethernet4"
                speed: 1000
                status: active
    - circuit_id: "COLT-PAR-TR-2001"
      circuit_type: upstream
      status: active
      description: "Colt upstream transit for Paris edge router 2"
      provider: "Colt Technology Services"
      location: "par01"
      monthly_cost: 2500  # demo input
      endpoints:
