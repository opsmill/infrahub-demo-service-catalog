---
plugin: opsmill.infrahub.inventory
# The plugin reads the Infrahub address and token from INFRAHUB_ADDRESS and INFRAHUB_API_TOKEN,
# which Semaphore passes to the playbook (SEMAPHORE_FORWARDED_ENV_VARS).

timeout: 30
strict: false

nodes:
  DcimDevice:
    include:
      - name
      - location.name
      - role
      - device_type.name
      # - device_type.platform.ansible_network_os
      - primary_address.address
      - status

compose:
  hostname: name
  ansible_host: primary_address.address | ansible.utils.ipaddr('address')
  device_type: device_type.name
  # platform: device_type.platform.ansible_network_os
  location: location.name
