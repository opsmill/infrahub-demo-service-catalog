[project]
name = "infrahub-demo-service-catalog"
version = "0.1.1"
description = "Service Catalog demo built with Infrahub and Streamlit for requesting and managing network services"
authors = [{name = "OpsMill", email = "info@opsmill.com"}]
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
    "infrahub-sdk[all]>=1.19.0",
    "streamlit>=1.51.0,<2.0.0",
    "watchdog>=6.0.0,<7.0.0",
    "fast-depends>=3.0.3,<4.0.0",
    "invoke>=2.2.1,<3.0.0",
    "httpx>=0.27.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.23.0,<2",
    "pytest-httpx>=0.30.0,<0.37",
    "pytest-clarity>=1.0.1",
    "ruff>=0.14.4",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.32.0",
    "yamllint>=1.37.1",
    "infrahub-testcontainers>=1.11.0",
    "rumdl>=0.2.55",
]

[tool.uv]
# numpy 2.4.0 was yanked upstream (backward-compatibility bug); avoid it.
constraint-dependencies = ["numpy!=2.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "--strict-markers"
markers = [
    "core: workflows every pull request must keep working. Run with -m 'not extended'.",
    "extended: additional workflows run on dependency bumps and on main. Adds ~30-40 minutes.",
    "offline: an integration-suite test that reads only repository files and needs no deployment.",
]

[tool.mypy]
pretty = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "infrahub_sdk.*"
follow_imports = "skip"

[tool.ruff]
line-length = 120

exclude = [
    ".git",
    ".venv",
    "env",
    "_build",
    "build",
    "dist",
    "examples",
]

extend-exclude = [
    ".agents/",
    ".specify/",
    ".superpowers/",
    "dev/commands/",
    "scratchpad/",
]


[tool.ruff.lint]
preview = true

task-tags = ["FIXME", "TODO"]

select = ["ALL"]

ignore = [
    "D",      # pydocstyle
    "DOC",    # pydoclint
    "CPY",    # flake8-copyright
    "T201",   # use of `print`
    "ISC",    # flake8-implicit-str-concat
    "COM812", # missing-trailing-comma
    "N999",   # Invalid module name
    "TD",
    "FIX",    # TODO
    "TRY",
    "B008",   # Do not perform function call `Depends` in argument defaults
    "EM102",  # Exception must not use an f-string literal
    "SIM117", # Use a single `with` statement with multiple contexts instead of nested `with` statements
    "G004",   # Logging statement uses f-string
    "S311",   # Standard pseudo-random generators are not suitable
    "LOG004", # `.exception()` call outside exception handlers
    "FBT",    # Boolean-typed positional argument in function definition
]


#https://docs.astral.sh/ruff/formatter/black/
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["infrahub_sdk", "infrahub_ctl"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.mccabe]
# Target max-complexity=10
max-complexity = 17

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password assigned to variable
    "S106",    # Possible hardcoded password assigned to argument
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "ANN204",  # Missing return type annotation for special method
    "PLR6301", # Method `XXXX` could be a function, class method, or static method
]

"schemas/data.py" = [
    "ARG001",    # Unused function argument
    "ANN201",  # Missing return type annotation for public function
    "B007",    # Loop control variable `node` not used within loop body
    "ANN001",  # Missing type annotation
]

"tasks.py" = [
    "PLC0415", # `import` should be at the top-level of a file
    "PT028",   # Test function parameter has default argument
]

[tool.rumdl.global]
disable = [
    "MD013",
    "MD014",
    "MD024",
    "MD029",
    "MD033",
    "MD034",
    "MD036",
    "MD041",
    "MD045",
    "MD047",
]
exclude = [
    ".agents/",
    ".claude/",
    ".git/",
    ".mypy_cache/",
    ".ruff_cache/",
    ".specify/",
    ".superpowers/",
    ".venv/",
    "dev/commands/",
    "docs/.docusaurus/",
    "docs/build/",
    "docs/node_modules/",
    "node_modules/",
    "scratchpad/",
]
respect-gitignore = true

[tool.rumdl.MD007]
indent = 4

[tool.rumdl.MD025]
front-matter-title = ""

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["service_catalog*"]
