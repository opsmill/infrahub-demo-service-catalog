---
extends: default

# /.github is deliberately absent: the workflow files are YAML this repository authors and CI runs,
# so they are linted like everything else. Their own `# yamllint disable` headers waive only the
# rules a workflow genuinely needs waived.
ignore: |
  /.git
  /.venv
  node_modules/

rules:
  new-lines: disable
  comments-indentation: disable
  comments:
    # Changed this to stop a mess between linters from Prettier (vscode) to yamllint
    # See https://github.com/prettier/prettier/pull/10926 or https://github.com/redhat-developer/vscode-yaml/issues/433
    min-spaces-from-content: 1
  line-length:
    max: 140
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: false
