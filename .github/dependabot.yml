---
version: 2
updates:
  # Regular dependency upgrades target main after cooldown.
  # Security updates target the default branch and are reviewed manually.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      - dependency-name: "github/gh-aw-actions/**"  # managed by gh aw compile
