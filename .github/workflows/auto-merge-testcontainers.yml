---
# yamllint disable rule:truthy rule:line-length
name: Auto-merge tested Infrahub testcontainers bumps

# workflow_run reads a completed CI run without checking out pull request code.
# The merge token is used only after CI passes; no pull request code is checked out.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the pull request and merge its tested head
        env:
          GH_TOKEN: ${{ secrets.GH_UPDATE_PACKAGE_OTTO }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # A green CI run is insufficient if the integration job was skipped.
          INTEGRATION=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" \
            --paginate --jq '.jobs[] | select(.name | startswith("integration-test")) | .conclusion')
          if [ "${INTEGRATION}" != "success" ]; then
            echo "::notice::Integration test did not pass in CI run ${RUN_ID}; leaving the PR open."
            exit 0
          fi

          # Some runs omit pull_requests; the commit association is a safe fallback
          # only when it resolves to exactly one open pull request.
          PR_NUMBER=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" \
            --jq '.pull_requests | map(.number) | unique | if length == 1 then .[0] else empty end')
          if [ -z "${PR_NUMBER}" ]; then
            PR_NUMBER=$(gh api "repos/${GH_REPO}/commits/${RUN_SHA}/pulls" \
              --jq '[.[] | select(.state == "open") | .number] | unique | if length == 1 then .[0] else empty end')
          fi
          if [ -z "${PR_NUMBER}" ]; then
            echo "::notice::CI run ${RUN_ID} has no unique open pull request."
            exit 0
          fi

          PR=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")
          AUTHOR=$(jq -r '.user.login' <<< "${PR}")
          BASE=$(jq -r '.base.ref' <<< "${PR}")
          HEAD_REPO=$(jq -r '.head.repo.full_name // empty' <<< "${PR}")
          HEAD_REF=$(jq -r '.head.ref' <<< "${PR}")
          HEAD_SHA=$(jq -r '.head.sha' <<< "${PR}")
          STATE=$(jq -r '.state' <<< "${PR}")
          if [ "${STATE}" != "open" ] || [ "${BASE}" != "main" ] ||
             [ "${HEAD_REPO}" != "${GH_REPO}" ] || [ "${HEAD_SHA}" != "${RUN_SHA}" ]; then
            echo "::notice::PR #${PR_NUMBER} is closed, external, or changed since CI ran."
            exit 0
          fi

          if [ "${AUTHOR}" != "opsmill-bot" ]; then
            exit 0
          fi
          case "${HEAD_REF}" in
            update-infrahub-*) ;;
            *) exit 0 ;;
          esac
          # A combined SDK update still needs a human review.
          if [[ "${HEAD_REF}" == *-sdk-* ]]; then
            exit 0
          fi
          ALLOWED='Dockerfile|docker-compose.yml|docker-compose.override.yml|pyproject.toml|uv.lock'

          FILES=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename')
          if [ -z "${FILES}" ]; then
            echo "::error::PR #${PR_NUMBER} has no changed files."
            exit 1
          fi
          while IFS= read -r file; do
            case "|${ALLOWED}|" in
              *"|${file}|"*) ;;
              *)
                echo "::notice::${file} is outside the testcontainers bump; leaving PR #${PR_NUMBER} for review."
                exit 0
                ;;
            esac
          done <<< "${FILES}"

          # A matching branch and filenames alone do not prove this is an
          # Infrahub release bump. Require the declared testcontainers pin to move.
          BASE_SHA=$(jq -r '.base.sha' <<< "${PR}")
          BASE_PYPROJECT=$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${GH_REPO}/contents/pyproject.toml?ref=${BASE_SHA}")
          HEAD_PYPROJECT=$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${GH_REPO}/contents/pyproject.toml?ref=${RUN_SHA}")
          BASE_PIN=$(grep -E '^[[:space:]]*"?infrahub-testcontainers' <<< "${BASE_PYPROJECT}" || true)
          HEAD_PIN=$(grep -E '^[[:space:]]*"?infrahub-testcontainers' <<< "${HEAD_PYPROJECT}" || true)
          if [ -z "${BASE_PIN}" ] || [ -z "${HEAD_PIN}" ] || [ "${BASE_PIN}" = "${HEAD_PIN}" ]; then
            echo "::notice::PR #${PR_NUMBER} does not move the testcontainers pin."
            exit 0
          fi

          # REST merge honors the bot's pull-request-only ruleset bypass. The
          # tested SHA prevents an intervening push from being merged.
          MERGED=$(gh api --method PUT "repos/${GH_REPO}/pulls/${PR_NUMBER}/merge" \
            -f sha="${RUN_SHA}" -f merge_method=squash --jq '.merged')
          if [ "${MERGED}" != "true" ]; then
            echo "::error::GitHub did not merge PR #${PR_NUMBER}."
            exit 1
          fi
